<!DOCTYPE html>
<html lang="vi" data-theme="light" data-world="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Panda HSK — Nền tảng học tiếng Trung toàn diện theo chuẩn HSK 3.0 (HSK 1 đến HSK 9): từ vựng SRS, luyện thi thử, chấm phát âm AI, tập viết Hanzi và video bài giảng." />
  <meta property="og:title" content="Panda HSK — Học Tiếng Trung & Luyện Thi HSK 1–9" />
  <meta property="og:description" content="Lộ trình học tiếng Trung bài bản HSK 1–9, từ điển vẽ tay, luyện nói AI và thi thử chuẩn quốc tế." />
  <meta name="theme-color" content="#c23b2b" />
  <title>Panda HSK — Nền Tảng Học Tiếng Trung Toàn Diện HSK 1–9</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js" defer></script>
</head>
<body>
  <div id="app" class="layout-wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" id="btn-home">
        <div class="brand-logo-box">🐼</div>
        <span class="brand-name">Panda HSK</span>
      </div>

      <nav class="sidebar-menu">
        <button class="side-item active" data-tab="home"><span class="side-ico">🏠</span><span class="side-txt">Trang chủ</span></button>
        <button class="side-item" data-tab="placement"><span class="side-ico">🧭</span><span class="side-txt">Xếp lớp đầu vào</span></button>
        <button class="side-item" data-tab="journey"><span class="side-ico">🗺️</span><span class="side-txt">Hành trình bài bản</span></button>
        <button class="side-item" data-tab="practice"><span class="side-ico">📜</span><span class="side-txt">Sổ từ vựng</span></button>
        <button class="side-item" data-tab="dictionary"><span class="side-ico">🔍</span><span class="side-txt">Từ điển & Vẽ tay</span></button>
        <button class="side-item" data-tab="writing"><span class="side-ico">✍️</span><span class="side-txt">Tập viết chữ Hán</span></button>
        <button class="side-item" data-tab="video"><span class="side-ico">🎬</span><span class="side-txt">Video bài giảng</span></button>
        <button class="side-item" data-tab="speak"><span class="side-ico">🎙️</span><span class="side-txt">Luyện nói AI</span></button>
        <button class="side-item" data-tab="review"><span class="side-ico">🔁</span><span class="side-txt">Ôn tập SRS</span></button>
        <button class="side-item" data-tab="exam"><span class="side-ico">📋</span><span class="side-txt">Luyện thi HSK 1–9</span></button>
        <button class="side-item" data-tab="arena"><span class="side-ico">⚔️</span><span class="side-txt">Đấu Trường</span></button>
        <button class="side-item" data-tab="stats"><span class="side-ico">📊</span><span class="side-txt">Thống kê & Nhắc học</span></button>
        <button class="side-item" data-tab="about-hsk"><span class="side-ico">📘</span><span class="side-txt">Giới thiệu HSK</span></button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-primary btn-block" id="btn-auth-sidebar">👤 ĐĂNG NHẬP / ĐĂNG KÝ</button>
        <button class="collapse-btn" id="btn-toggle-sidebar">« Thu gọn</button>
      </div>
    </aside>

    <div class="content-shell">
      <header class="top-header">
        <button class="mobile-menu-btn" id="btn-mobile-menu">☰</button>
        <div class="dict-search-wrap">
          <span class="search-ico">🔍</span>
          <input type="search" id="global-dict-search" placeholder="Từ điển nhanh: gõ chữ Hán, pinyin hoặc nghĩa tiếng Việt..." />
          <div id="global-search-dropdown" class="search-dropdown hidden"></div>
        </div>

        <div class="header-actions">
          <span class="stat-chip" id="ui-user-badge" style="cursor:pointer" title="Quản lý tài khoản">🐼 Khách</span>
          <span class="stat-chip" id="ui-level">Cấp 1 · HSK 1</span>
          <span class="stat-chip" id="ui-streak" title="Chuỗi ngày học">🔥 0</span>
          <span class="stat-chip" id="ui-coins" title="Xu thưởng">🪙 0</span>
          <button class="icon-circle-btn" id="btn-theme-top" title="Đổi giao diện Sáng / Tối">☀️</button>
        </div>
      </header>

      <main id="main-view" class="dashboard-main">
        <div class="card" style="text-align:center;padding:30px">Đang khởi tạo Panda HSK...</div>
      </main>

      <footer style="margin-top:24px;padding:16px 20px;border-top:1px solid var(--border);font-size:0.8rem;color:var(--text-muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px">
        <div>
          <strong>Panda HSK</strong> · Nguồn dữ liệu mở: <em>Complete HSK Vocabulary (HSK 3.0)</em>, <em>CC-CEDICT</em>, <em>Hanzi Writer</em>.
        </div>
        <div style="display:flex;gap:14px;flex-wrap:wrap">
          <a href="#about-hsk" data-pub-link="about-hsk" style="color:var(--primary)">Giới thiệu các cấp HSK</a>
          <a href="#privacy" data-pub-link="privacy" style="color:var(--primary)">Chính sách bảo mật</a>
          <a href="#terms" data-pub-link="terms" style="color:var(--primary)">Điều khoản sử dụng</a>
          <a href="#contact" data-pub-link="contact" style="color:var(--primary)">Liên hệ & Góp ý</a>
        </div>
      </footer>
    </div>
  </div>

  <button id="btn-ai-tutor" class="fab-tutor">
    <span class="fab-pulse"></span>
    🐼 <span>Hỏi Sư Phụ AI</span>
  </button>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Đóng">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
