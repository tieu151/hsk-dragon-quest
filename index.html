<!DOCTYPE html>
<html lang="vi" data-theme="light" data-world="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Long Môn HSK — Nền Tảng Học Tiếng Trung Toàn Diện</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/pinyin-pro@3.26.0/dist/index.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js" defer></script>
</head>
<body>
  <div id="app" class="layout-wrapper">
    <!-- SIDEBAR BÊN TRÁI GIỐNG BAOLINGO -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" id="btn-home">
        <div class="brand-logo-box">🐉</div>
        <span class="brand-name">Long Môn HSK</span>
      </div>

      <nav class="sidebar-menu">
        <button class="side-item active" data-tab="home"><span class="side-ico">🏠</span><span class="side-txt">Trang chủ</span></button>
        <button class="side-item" data-tab="practice"><span class="side-ico">📖</span><span class="side-txt">Luyện tập</span></button>
        <button class="side-item" data-tab="listen"><span class="side-ico">🎧</span><span class="side-txt">Luyện nghe</span></button>
        <button class="side-item" data-tab="speak"><span class="side-ico">🎙️</span><span class="side-txt">Luyện phát âm</span></button>
        <button class="side-item active-soft" data-tab="vocab"><span class="side-ico">📙</span><span class="side-txt">Từ vựng</span></button>
        <button class="side-item" data-tab="grammar"><span class="side-ico">🎓</span><span class="side-txt">Ngữ pháp</span></button>
        <button class="side-item" data-tab="review"><span class="side-ico">🔁</span><span class="side-txt">Ôn tập</span></button>
        <button class="side-item" data-tab="exam"><span class="side-ico">📋</span><span class="side-txt">Luyện thi HSK</span></button>
        <button class="side-item" data-tab="arena"><span class="side-ico">⚔️</span><span class="side-txt">Đấu Trường Từ Vựng</span></button>
        <button class="side-item" data-tab="story"><span class="side-ico">📚</span><span class="side-txt">Truyện đọc</span><span class="badge-new">MỚI</span></button>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-primary btn-block" id="btn-open-ai-side">🧙‍♂️ HỎI SƯ PHỤ AI</button>
        <button class="collapse-btn" id="btn-toggle-sidebar">« Thu gọn</button>
      </div>
    </aside>

    <!-- KHU VỰC CHÍNH BÊN PHẢI -->
    <div class="content-shell">
      <header class="top-header">
        <button class="mobile-menu-btn" id="btn-mobile-menu">☰</button>
        <div class="dict-search-wrap">
          <span class="search-ico">🔍</span>
          <input type="search" id="global-dict-search" placeholder="Từ điển: gõ chữ Hán, pinyin hoặc nghĩa tiếng Việt..." />
          <div id="global-search-dropdown" class="search-dropdown hidden"></div>
        </div>

        <div class="header-actions">
          <span class="stat-chip" id="ui-level">Cấp 1 · HSK 1</span>
          <span class="stat-chip" id="ui-streak" title="Chuỗi ngày học">🔥 0</span>
          <span class="stat-chip" id="ui-coins" title="Xu thưởng">🪙 0</span>
          <button class="icon-circle-btn" id="btn-theme-top" title="Đổi giao diện Sáng / Tối">☀️</button>
          <span class="lang-pill">🇻🇳 Tiếng Việt</span>
        </div>
      </header>

      <main id="main-view" class="dashboard-main">
        <div class="card" style="text-align:center;padding:30px">Đang tải dữ liệu học tập...</div>
      </main>
    </div>
  </div>

  <!-- NÚT NỔI TRỢ LÝ AI -->
  <button id="btn-ai-tutor" class="fab-tutor hidden">
    <span class="fab-pulse"></span>
    🧙‍♂️ <span>Sư Phụ AI</span>
  </button>

  <!-- MODAL -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Đóng">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
