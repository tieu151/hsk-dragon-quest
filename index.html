<!DOCTYPE html>
<html lang="vi" data-theme="light" data-world="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#b91c1c" />
  <title>Long Môn HSK — Học Tiếng Trung Qua Trò Chơi</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
  <script src="https://unpkg.com/pinyin-pro@3.26.0/dist/index.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js" defer></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" id="btn-home" role="button" tabindex="0">
        <span class="brand-logo">🐉</span>
        <div class="brand-info">
          <span class="brand-title">Long Môn HSK</span>
          <span class="player-level" id="ui-level">Cấp 1 · Tân Thủ</span>
        </div>
      </div>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" id="ui-xp-bar" style="width: 0%"></div>
        <span class="xp-bar-text" id="ui-xp-text">0 / 100 XP</span>
      </div>
      <div class="stats-pills">
        <span class="pill" id="ui-streak">🔥 0</span>
        <span class="pill" id="ui-freeze">❄️ 1</span>
        <span class="pill" id="ui-coins">🪙 0</span>
      </div>
    </header>

    <main id="main-view" class="main-view">
      <div class="card"><p>Đang đánh thức Rồng Con & nạp kho từ vựng...</p></div>
    </main>

    <button id="btn-ai-tutor" class="fab-tutor hidden">🧙‍♂️ <span>Hỏi Sư Phụ</span></button>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="home"><span class="nav-icon">🏯</span><span class="nav-label">Trang chủ</span></button>
      <button class="nav-btn" data-tab="map"><span class="nav-icon">🗺️</span><span class="nav-label">Hành trình</span></button>
      <button class="nav-btn" data-tab="arcade"><span class="nav-icon">🎮</span><span class="nav-label">Luyện tập</span></button>
      <button class="nav-btn" data-tab="vocab"><span class="nav-icon">📜</span><span class="nav-label">Sổ từ</span></button>
      <button class="nav-btn" data-tab="stats"><span class="nav-icon">📊</span><span class="nav-label">Thống kê</span></button>
      <button class="nav-btn" data-tab="profile"><span class="nav-icon">🏅</span><span class="nav-label">Hồ sơ</span></button>
    </nav>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
